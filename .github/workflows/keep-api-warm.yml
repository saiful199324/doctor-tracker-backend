# Render's free plan sleeps a service after 15 idle minutes, and waking takes up to a minute.
# Pinging the health check every 10 minutes keeps the demo responsive.
#
# Only during 08:00–23:00 Bangladesh time (02:00–17:00 UTC): free instance hours (750/month) are
# shared by every free service in the Render workspace, and pinging 24/7 would use ~744 of them.
#
# Repository: doctor-tracker-backend.
# Set the repository variable API_HEALTH_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 2-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_HEALTH_URL }}"
